<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Diagnóstico de importación · Juan Importa</title></head><body>
<!--
  EMBUDO CHAT · JUAN IMPORTA
  1) Diagnóstico tipo chat (preguntas + nombre, WhatsApp y correo) con resultado y puntaje.
  2) Testimonio y video de ventas (VSL) a pantalla completa.
     La pantalla del video se personaliza por ruta (A = empieza desde cero, B = ya tiene negocio):
     barra con su perfil e índice, mensaje con su nombre, titular, una nota según su freno y el VSL de su ruta.
     Todo se edita en CONFIG > rutas.
  3) Después del VSL: preguntas de calificación (las del Typeform). Si califica, va a la agenda de su ruta;
     si tiene menos de USD 1.000, lo manda al canal de YouTube.

  CÓMO USARLO EN GOHIGHLEVEL
  1. Crea una página en blanco en tu funnel (sin header ni footer).
  2. Agrega un elemento "Custom JS / HTML" (Código personalizado) y pega TODO este archivo.
  3. Edita solo el bloque CONFIG dentro del script (busca "CONFIG (edita aquí)").
  4. El chat ocupa toda la pantalla; el resto de la página queda oculto detrás.
  5. Publica y prueba en el celular. El editor de GHL a veces no ejecuta scripts: usa la vista previa publicada.

  MODOS DE PRUEBA (agrega al final de la URL)
  ?rapido=1  quita las pausas de "escribiendo..." para revisar textos rápido.
  ?prueba=1  responde todo solo, NO manda datos a ningún lado y no dispara el pixel.

  GOOGLE SHEETS: el código de la hoja está en el archivo apps-script-leads.gs (con sus instrucciones).
  Publícalo como "Aplicación web" y pega la URL /exec en sheetsWebhook. La hoja tiene dos pestañas:
  "Leads" (una fila por persona, con sus respuestas y UTMs) y "Eventos" (cada paso del embudo).

  UTMs: el embudo lee utm_source, utm_medium, utm_campaign, utm_content, utm_term, fbclid y gclid de la URL.
  Si la persona vuelve después sin UTMs, se usan las de su primera visita (se guardan 30 días en su navegador).
  En Meta, en el anuncio > "Parámetros de URL", pega:
    utm_source=facebook&utm_medium=paid&utm_campaign={{campaign.name}}&utm_term={{adset.name}}&utm_content={{ad.name}}

  GHL: el Workflow "DIAGNÓSTICO JUAN IMPORTA → NOTA EN CONTACTO" (disparador "Webhook entrante") recibe el evento
  "lead" (cuando deja sus datos), crea/actualiza el contacto y le deja una nota con etapa, respuestas y origen.
  Su URL va en ghlWebhook. Los eventos que llegan a GHL se eligen en ghlEventos (cada ejecución del webhook cuesta).
-->

function valida(tipo, v){
  if (tipo === "nombre") return v.length >= 2 ? "" : "Escribe tu nombre.";
  if (tipo === "email"){
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return "Revisa tu correo, parece que le falta algo.";
    if (/@(gmial|gmal|gamil|hotmal|hotmial)\./i.test(v)) return "Revisa cómo escribiste tu correo.";
    return "";
  }
  if (tipo === "tel"){ var d = v.replace(/\D/g, ""); return d.length >= 10 && d.length <= 15 ? "" : "Escribe tu número completo, ej. 300 123 4567"; }
  if (tipo === "texto") return v.length >= 3 ? "" : "Cuéntame un poco más.";
  if (tipo === "numero") return /\d/.test(v) ? "" : "Escribe solo el número, ej. 2000";
  return "";
}

// Hace una pregunta de cualquier tipo y guarda la respuesta. Devuelve la opción elegida (o el texto)
async function pregunta(q){
  await diVarios(q.antes);
  await di(tx(q.texto));
  var r;
  if (q.tipo === "texto" || q.tipo === "numero"){
    var v = await pideDato(q.tipo, q.placeholder || "Escribe aquí");
    S.resp[q.id] = q.tipo === "numero" ? normNum(v) : v;
    r = { t: v };
  } else {
    r = await elegir(q.opciones);
    S.resp[q.id] = r.t; S.op[q.id] = r; S.pts += r.pts || 0;
  }
  avanza(); track("pregunta", { pregunta: q.id }); enviar("p_" + q.id);
  if (r.descalifica) return r;
  if (r.respuesta) await di(tx(r.respuesta));
  else if (q.despues) await diVarios(q.despues);
  return r;
}

/* ---------- puntaje ---------- */
function calcula(){
  var min = 0, max = 0;
  P.forEach(function(q){
    var v = q.opciones.map(function(o){ return o.pts || 0; });
    min += Math.min.apply(null, v); max += Math.max.apply(null, v);
  });
  var r = max > min ? (S.pts - min) / (max - min) : .5;
  S.indice = Math.round(20 + r * 72);
  var perf = CONFIG.perfiles.slice().sort(function(a, b){ return a.min - b.min; });
  S.perfil = perf[0];
  perf.forEach(function(p){ if (S.indice >= p.min) S.perfil = p; });
}

  } else S.ruta = (CONFIG.rutaPorEtapa || {})[S.resp.etapa] || "";
  return (S.ruta && CONFIG.rutas[S.ruta]) || null;
}

  rutaActual();   // deja la ruta lista para que viaje en todos los eventos desde el lead
  track("lead"); enviar("lead");

  await di(tx(CONFIG.textos.analizando));
  await checklist();
  await di(tx(CONFIG.textos.resultadoListo), { espera: 700 });
  fila("doc", tarjetaResultado(), "wide");
  avanza(); enviar("resultado");
  await wait(2200);

  for (var k = 0; k < P.length; k++){ var o = S.op[P[k].id]; if (o && o.resultado) await di(tx(o.resultado)); }
  if (S.perfil.siguiente) await di(tx(S.perfil.siguiente));

  var RT = rutaActual(), TES = (RT && RT.testimonios) || CONFIG.testimonios || [];
  if (TES.length){
    var nombresT = TES.map(function(x){ return x.nombre; }).filter(Boolean);
    await di(tx(CONFIG.textos.antesTestimonio).replace(/\{testimonio\}/g,
      nombresT.length ? nombresT.slice(0, -1).join(", ") + (nombresT.length > 1 ? " y " : "") + nombresT[nombresT.length - 1] : "nuestros alumnos"));
    for (var t = 0; t < TES.length; t++){
      var te = TES[t];
      var nodo = media(te, "FALTA TESTIMONIO: pon el video o la imagen en CONFIG.testimonios");
      if (te.texto){ var w = document.createElement("div"); w.appendChild(nodo); var cap = document.createElement("div"); cap.className = "ci-cap"; cap.textContent = te.texto; w.appendChild(cap); nodo = w; }
      fila("doc", nodo, "wide" + (te.vertical ? " vert" : ""));
      await wait(400);
    }
    await elegir([{ t: CONFIG.textos.botonTestimonio }]);
    enviar("testimonio_visto");
  }

  await diVarios(CONFIG.textos.antesVideo);
  await elegir([{ t: CONFIG.textos.botonVideo }]);
  avanza();
  await di(tx(CONFIG.textos.abriendoVideo), { espera: 800 });
  await wait(700);
  abreCine();
}

async function calificar(){
  var K = CONFIG.calificacion;
  await wait(400);
  nActual = CAL.length;
  await diVarios(K.intro);
  for (var i = 0; i < CAL.length; i++){
    var r = await pregunta(CAL[i]);
    if (r.descalifica){
      S.califica = "no";
      track("no_califica"); enviar("no_califica");
      await diVarios(K.noCalifica);
      limpiaDock();
      var a = document.createElement("a"); a.className = "ci-opt"; a.href = K.urlNoCalifica; a.target = "_blank"; a.rel = "noopener";
      a.textContent = K.botonNoCalifica;
      dock.appendChild(a);
      prog.style.width = "100%";
      return;
    }
  }
  S.califica = "si";
  track("calificado"); enviar("calificado");
  await diVarios(K.final);
  prog.style.width = "100%";
  botonAgenda(K.botonAgenda);
}

main();
})();
</script>
